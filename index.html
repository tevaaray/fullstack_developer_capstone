<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CodeCraftHub: Your Learning Management Platform</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text: #f8fafc;
      --muted: #94a3b8;
      --primary: #8B5CF6;
      --success: #F59E0B;
      --danger: #ef4444;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding: 2rem; }
    .container { max-width: 1100px; margin: 0 auto; }
    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem; border-bottom: 1px solid #334155; padding-bottom: 1rem; }
    h1 { font-size: 1.8rem; color: var(--primary); }
    .stats { display: flex; gap: 1rem; margin-bottom: 2rem; }
    .stat-card { background: var(--card-bg); padding: 1rem 1.5rem; border-radius: 8px; flex: 1; text-align: center; }
    .stat-card h3 { font-size: 1.5rem; }
    .stat-card p { color: var(--muted); font-size: 0.9rem; }
    .controls { display: flex; gap: 1rem; margin-bottom: 1.5rem; }
    input, select, textarea, button { padding: 0.6rem 1rem; border-radius: 6px; border: 1px solid #334155; background: var(--card-bg); color: var(--text); }
    input[type="text"], input[type="date"], textarea { flex: 1; }
    .btn-primary { background-color: #8B5CF6; color: #ffffff; border: none; cursor: pointer; font-weight: 600; }
    .btn-primary:hover { opacity: 0.9; }
    .btn-success { background-color: #F59E0B; color: #ffffff; border: none; cursor: pointer; font-weight: 600; }
    .btn-success:hover { opacity: 0.9; }
    .btn-danger { background-color: #ef4444; color: #ffffff; border: none; cursor: pointer; font-weight: 600; }
    .btn-danger:hover { opacity: 0.9; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 1.5rem; }
    .card { background: var(--card-bg); border-radius: 8px; padding: 1.25rem; display: flex; flex-direction: column; justify-content: space-between; }
    .badge { display: inline-block; padding: 0.25rem 0.6rem; border-radius: 12px; font-size: 0.8rem; font-weight: bold; }
    .status-Not-Started { background: rgba(245, 158, 11, 0.2); color: #F59E0B; }
    .status-In-Progress { background: rgba(139, 92, 246, 0.2); color: #8B5CF6; }
    .status-Completed { background: rgba(16, 185, 129, 0.2); color: #10b981; }
    .card-actions { margin-top: 1rem; display: flex; gap: 0.5rem; justify-content: flex-end; }
    .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.7); justify-content: center; align-items: center; }
    .modal-content { background: var(--card-bg); padding: 2rem; border-radius: 8px; width: 400px; display: flex; flex-direction: column; gap: 1rem; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>CodeCraftHub: Your Learning Management Platform</h1>
    </header>

    <div class="stats" id="stats">
      <div class="stat-card"><h3 id="stat-total">0</h3><p>Total Courses</p></div>
      <div class="stat-card"><h3 id="stat-not-started">0</h3><p>Not Started</p></div>
      <div class="stat-card"><h3 id="stat-in-progress">0</h3><p>In Progress</p></div>
      <div class="stat-card"><h3 id="stat-completed">0</h3><p>Completed</p></div>
    </div>

    <div class="controls">
      <input type="text" id="search" placeholder="Search courses..." oninput="handleSearch()">
      <button class="btn-primary" onclick="openModal()">+ Add Course</button>
    </div>

    <div class="grid" id="course-grid"></div>
  </div>

  <div class="modal" id="modal">
    <div class="modal-content">
      <h2 id="modal-title">Add New Course</h2>
      <input type="hidden" id="course-id">
      <input type="text" id="name" placeholder="Course Name" required>
      <textarea id="description" placeholder="Description" rows="3"></textarea>
      <input type="date" id="target_date" required>
      <select id="status">
        <option value="Not Started">Not Started</option>
        <option value="In Progress">In Progress</option>
        <option value="Completed">Completed</option>
      </select>
      <div style="display:flex; gap:0.5rem; justify-content:flex-end;">
        <button onclick="closeModal()" style="background:#475569">Cancel</button>
        <button class="btn-success" onclick="saveCourse()">Save</button>
      </div>
    </div>
  </div>

  <script>
    const API_BASE = 'http://localhost:5000/api/courses';

    async function loadCourses(query = '') {
      try {
        const url = query ? `${API_BASE}?q=${encodeURIComponent(query)}` : API_BASE;
        const res = await fetch(url);
        const courses = await res.json();
        renderCourses(courses);
        updateStats(courses);
      } catch (e) {
        console.error("Error loading courses:", e);
      }
    }

    function renderCourses(courses) {
      const grid = document.getElementById('course-grid');
      grid.innerHTML = courses.map(c => `
        <div class="card">
          <div>
            <div style="display:flex; justify-content:space-between; align-items:start; margin-bottom:0.5rem;">
              <h3>${c.name}</h3>
              <span class="badge status-${c.status.replace(/\s+/g, '-')}">${c.status}</span>
            </div>
            <p style="color:var(--muted); font-size:0.9rem; margin-bottom:1rem;">${c.description}</p>
          </div>
          <div>
            <small style="color:var(--muted)">Target: ${c.target_date || 'N/A'}</small>
            <div class="card-actions">
              <button class="btn-primary" onclick="editCourse(${c.id})">Edit</button>
              <button class="btn-danger" onclick="handleDelete(${c.id})">Remove</button>
            </div>
          </div>
        </div>
      `).join('');
    }

    function updateStats(courses) {
      document.getElementById('stat-total').innerText = courses.length;
      document.getElementById('stat-not-started').innerText = courses.filter(c => c.status === 'Not Started').length;
      document.getElementById('stat-in-progress').innerText = courses.filter(c => c.status === 'In Progress').length;
      document.getElementById('stat-completed').innerText = courses.filter(c => c.status === 'Completed').length;
    }

    function handleSearch() {
      const q = document.getElementById('search').value;
      loadCourses(q);
    }

    function openModal(course = null) {
      document.getElementById('modal').style.display = 'flex';
      if (course) {
        document.getElementById('modal-title').innerText = 'Edit Course';
        document.getElementById('course-id').value = course.id;
        document.getElementById('name').value = course.name;
        document.getElementById('description').value = course.description;
        document.getElementById('target_date').value = course.target_date || course.targetDate || '';
        document.getElementById('status').value = course.status;
      } else {
        document.getElementById('modal-title').innerText = 'Add New Course';
        document.getElementById('course-id').value = '';
        document.getElementById('name').value = '';
        document.getElementById('description').value = '';
        document.getElementById('target_date').value = '';
        document.getElementById('status').value = 'Not Started';
      }
    }

    function closeModal() {
      document.getElementById('modal').style.display = 'none';
    }

    async function saveCourse() {
      const id = document.getElementById('course-id').value;
      const data = {
        name: document.getElementById('name').value,
        description: document.getElementById('description').value,
        target_date: document.getElementById('target_date').value,
        status: document.getElementById('status').value
      };

      const method = id ? 'PUT' : 'POST';
      const url = id ? `${API_BASE}/${id}` : API_BASE;

      await fetch(url, {
        method,
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data)
      });

      closeModal();
      loadCourses();
    }

    async function editCourse(id) {
      const res = await fetch(`${API_BASE}/${id}`);
      const course = await res.json();
      openModal(course);
    }

    async function handleDelete(id) {
      if (confirm('Are you sure you want to remove this course?')) {
        await fetch(`${API_BASE}/${id}`, { 
          method: 'DELETE' 
        });
        loadCourses();
      }
    }

    loadCourses();
  </script>
</body>
</html>
